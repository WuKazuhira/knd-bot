name: Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-draw-contract:
    name: Test PJSK draw HTTP contract
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image from cached layers
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kndbot:draw-contract
          cache-from: type=gha

      - name: Test Python draw HTTP contract
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/app:ro"
          --tmpfs /tmp/kndbot-data
          -w /app
          -e KNDBOT_DATA_DIR=/tmp/kndbot-data
          -e KNDBOT_RESOURCE_DIR=/app/data/resources
          -e KNDBOT_LOG_DIR=/tmp/kndbot-data/log
          -e KNDBOT_TEMP_DIR=/tmp/kndbot-data/temp
          --entrypoint python
          kndbot:draw-contract
          -m unittest services.pjsk_draw.test_http_contract

  verify-go-pjsk:
    name: Verify Go PJSK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Go/Python PJSK integration
        run: bash src/services/go/go-pjsk-bot/scripts/verify.sh

      - name: Build Go PJSK image
        run: docker build -t kndbot-go-pjsk:ci src/services/go/go-pjsk-bot

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.17.1

      - name: Check Python source
        run: ruff check src
