# 本项目就是线上那套（GitHub: KND-BOT），沿用 kndbot 这组命名。
# 注意宿主上还有个停在 2026-08-13 的废弃副本 /home/kazuhira/kndbot，
# 它的 compose 用了完全相同的 image tag、container_name 和端口，
# 在那边执行 build/up 会顶掉本项目的容器并覆盖 kndbot:local 镜像。
# 名字都参数化了，真要两套并存就在 .env 里覆盖 KND_PROJECT/KND_PREFIX/KND_IMAGE/端口。
name: ${KND_PROJECT:-kndbot}

services:
  postgres:
    image: postgres:16
    container_name: ${KND_PREFIX:-kndbot}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kndbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kndbot}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromium:
    build:
      context: .
      dockerfile: Dockerfile.chromium
      network: host
    image: ${KND_CHROMIUM_IMAGE:-kndbot-chromium:local}
    container_name: ${KND_PREFIX:-kndbot}-chromium
    restart: unless-stopped
    ports:
      - "${KND_PORT:-18081}:8081"
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - host.docker.internal:host-gateway
    # 渲染图片时浏览器直接打开 file:///app/... 模板，需要与 kndbot 看到相同路径
    volumes:
      - ./src:/app/src:ro
      - ./data/resources:/app/data/resources:ro
      - ./data/resources/font:/usr/local/share/fonts/kndbot:ro

  deck-service:
    image: ghcr.io/team-haruki/deck-service:latest
    container_name: ${KND_PREFIX:-kndbot}-deck-service
    restart: unless-stopped
    ports:
      - "${DECK_SERVICE_PORT:-45557}:3000"
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DECK_DATA_DIR: /deck-data
      DECK_MASTERDATA_BASE_DIR: /masterdata
      DECK_MASTERDATA_REGIONS: jp,cn,tw
      DECK_MUSICMETAS_FILE_JP: /deckrec/musicmetas_jp.json
      DECK_MUSICMETAS_FILE_CN: /deckrec/musicmetas_cn.json
      DECK_MUSICMETAS_FILE_TW: /deckrec/musicmetas_tw.json
      DECK_MUSICMETAS_REGIONS: jp,cn,tw
      RUST_LOG: ${DECK_SERVICE_RUST_LOG:-deck_service=info}
    volumes:
      - ${DECK_CPP_DATA_DIR:-./data/pjsk/ondemand/deckrec/deck-data}:/deck-data:ro
      - ./data/pjsk/ondemand:/masterdata:ro
      - ./data/pjsk/ondemand/deckrec:/deckrec:ro
      - ./volumes/deck-service:/data

  # pjsk 绘图服务：生产常驻。Go PJSK 业务只负责取数与组织载荷，图片统一由此服务生成。
  # 复用 kndbot 镜像（同一套依赖与字体）。data/pjsk 要可写：
  # pjsk-draw 只读共享主数据/资源，资源下载仍由 Go helper/业务服务负责。
  pjsk-draw:
    image: ${KND_IMAGE:-kndbot:local}
    container_name: ${KND_PREFIX:-kndbot}-pjsk-draw
    restart: unless-stopped
    working_dir: /app
    # 基础 kndbot 镜像默认 entrypoint 会启动完整机器人；绘图服务必须直接执行独立 HTTP 入口。
    entrypoint: ["python"]
    command: ["-m", "services.pjsk_draw.serve"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PJSK_DRAW_PORT:-45560}:45560"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-kndbot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-kndbot}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kndbot}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-kndbot}
      PJSK_DRAW_HOST: 0.0.0.0
      PJSK_DRAW_PORT: "45560"
    volumes:
      - ./config:/app/config:ro
      - ./data/pjsk:/app/data/pjsk
      # entrypoint 会向资源目录增量补齐/缓存资源，独立绘图服务需要可写挂载。
      - ./data/resources:/app/data/resources
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:45560/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # go-pjsk-bot：PJSK 业务常驻 Go 服务。生产 standalone 模式下接管 Go 二进制注册的全部 PJSK 指令。
  # OneBotFilter 同时把事件送到 Python 主进程（非 PJSK）和本服务；图片统一走 pjsk-draw。
  go-pjsk-bot:
    build:
      context: ./src/services/go/go-pjsk-bot
      network: host
    image: ${KND_GO_PJSK_IMAGE:-kndbot-go-pjsk:local}
    container_name: ${KND_PREFIX:-kndbot}-go-pjsk-bot
    restart: unless-stopped
    # OneBotFilter 在宿主机上主动连接 Go 的反向 WS。
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      pjsk-draw:
        condition: service_healthy
      pjsk-helper:
        condition: service_healthy
      sekai-api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # OneBotFilter 反向 WS：Filter 连接本服务；生产固定使用 reverse。
      PJSKBOT_ONEBOT_MODE: ${PJSKBOT_ONEBOT_MODE:-reverse}
      # standalone=1 时接管 Go 二进制中注册的全部 PJSK 指令。
      PJSKBOT_STANDALONE: ${PJSKBOT_STANDALONE:-1}
      PJSKBOT_ONEBOT_LISTEN_ADDR: ${PJSKBOT_ONEBOT_LISTEN_ADDR:-:3001}
      PJSKBOT_ONEBOT_PATH: ${PJSKBOT_ONEBOT_PATH:-/onebot/v11/ws}
      PJSKBOT_ONEBOT_WS_URL: ${PJSKBOT_ONEBOT_WS_URL:-ws://host.docker.internal:3001}
      PJSKBOT_ONEBOT_TOKEN: ${PJSKBOT_ONEBOT_TOKEN:-}
      # standalone 模式下不读取 ownership 清单；保留该变量仅供回滚到灰度模式。
      KND_GO_OWNED_COMMANDS: ${KND_GO_OWNED_COMMANDS:-[]}
      # 超级用户 QQ 列表（逗号分隔）：cnmsr 白名单、清空sk订阅、打歌分数等管理指令需要
      PJSKBOT_SUPERUSERS: ${PJSKBOT_SUPERUSERS:-}
      # 与 Python 主进程共用 SUPERUSERS；Go 侧兼容其 JSON 数组格式。
      SUPERUSERS: ${SUPERUSERS:-[]}
      # 共享数据库（与 Python 同一个 postgres 与表）
      DATABASE_URL: postgresql://${POSTGRES_USER:-kndbot}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-kndbot}
      # 依赖的微服务：出图走 pjsk-draw，数据复用 helper / sekai-api。
      PJSK_DRAW_SERVICE_URL: ${PJSK_DRAW_SERVICE_URL:-http://pjsk-draw:45560}
      PJSK_HELPER_URL: ${PJSK_HELPER_URL:-http://pjsk-helper:8000}
      SEKAI_API_URL: ${SEKAI_API_URL:-http://sekai-api:9999}
      GAMEAPI_TOKEN: ${GAMEAPI_TOKEN:-}
      # sekai-api 访问 token：remote/live/token/打歌分数指令需要
      SEKAI_API_TOKEN: ${SEKAI_API_TOKEN:-}
      # remote 旧部署宿主控制（容器化 sekai-api 时可留空）
      SEKAI_CONTROL_URL: ${SEKAI_CONTROL_URL:-}
      SEKAI_CONTROL_TOKEN: ${SEKAI_CONTROL_TOKEN:-}
      SEKAI_REMOTE_ACCOUNT: ${SEKAI_REMOTE_ACCOUNT:-}
      SEKAI_REMOTE_REGION: ${SEKAI_REMOTE_REGION:-cn}
      SEKAI_LIVE_INTERVAL: ${SEKAI_LIVE_INTERVAL:-80}
      SEKAI_LIVE_AUTO_STOP: ${SEKAI_LIVE_AUTO_STOP:-03:55}
      # 共享目录（与其它服务同一份 data/pjsk 与 config）
      PJSK_DATA_DIR: /app/data/pjsk
      PJSK_CONFIG_DIR: /app/config
      PJSK_STATIC_DIR: /app/data/pjsk/static
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config:/app/config:ro
      - ./data/pjsk:/app/data/pjsk
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # sekai-api：游戏 API 代理（Go 版）。源码不入库，见 .gitignore。
  # masterdata 只读复用 kndbot 的数据，账号与缓存落在 volumes/sekai-api。
  sekai-api:
    build:
      context: ./src/services/go/sekai-api
      network: host
    image: ${KND_SEKAI_API_IMAGE:-kndbot-sekai-api:local}
    container_name: ${KND_PREFIX:-kndbot}-sekai-api
    restart: unless-stopped
    ports:
      - "${SEKAI_API_PORT:-9999}:9999"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SEKAI_CONFIG: /app/config.yaml
      SEKAI_DATA_DIR: /app/Data
      SEKAI_MASTERDATA_DIR: /masterdata
      SEKAI_LISTEN_ADDR: ":9999"
      SEKAI_JWT_SECRET: ${SEKAI_API_JWT_SECRET:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium}
    volumes:
      - ./data/pjsk/ondemand:/masterdata:ro
      - ./volumes/sekai-api/Data:/app/Data
      - ./config/sekai-api/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/echo"]
      interval: 30s
      timeout: 5s
      retries: 3

  pjsk-helper:
    build:
      context: ./src/services/go/go-pjsk-helper
      network: host
    image: ${KND_PJSK_HELPER_IMAGE:-kndbot-pjsk-helper:local}
    container_name: ${KND_PREFIX:-kndbot}-pjsk-helper
    restart: unless-stopped
    ports:
      - "${PJSK_HELPER_PORT:-45558}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PJSK_DATA_DIR: /data/pjsk
      PJSK_SERVERS_YAML: /config/pjsk/servers.yaml
      # Go PJSK 生产模式默认由 helper 常驻同步主数据和榜线历史。
      ENABLE_MASTERDATA_SYNC: ${PJSK_HELPER_MASTERDATA_SYNC:-1}
      ENABLE_RANKING_COLLECT: ${PJSK_HELPER_RANKING_COLLECT:-1}
      GAMEAPI_TOKEN: ${GAMEAPI_TOKEN:-}
      KNDBOT_CALLBACK_URL: ${PJSK_HELPER_CALLBACK_URL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium}
    volumes:
      - ./data/pjsk:/data/pjsk
      - ./config/pjsk:/config/pjsk:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  kndbot:
    build:
      context: .
      network: host
      extra_hosts:
        - host.docker.internal:host-gateway
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${BUILD_ALL_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium,host.docker.internal}
    image: ${KND_IMAGE:-kndbot:local}
    container_name: ${KND_PREFIX:-kndbot}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chromium:
        condition: service_started
      deck-service:
        condition: service_started
    working_dir: /app
    network_mode: service:chromium
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      PORT: 8081
      SUPERUSERS: ${SUPERUSERS:-[]}
      # Go 常驻模式：Python 主进程不加载 plugins.pjsk 业务插件。
      KNDBOT_PJSK_RUNTIME: ${KNDBOT_PJSK_RUNTIME:-go}
      # 仅用于回滚到 Python/灰度模式；go runtime 下不会注册 ownership preprocessor。
      KND_GO_OWNED_COMMANDS: ${KND_GO_OWNED_COMMANDS:-[]}
      BOT_DISPLAY_NAME: ${BOT_DISPLAY_NAME:-小七}
      SESSION_EXPIRE_TIMEOUT: ${SESSION_EXPIRE_TIMEOUT:-00:01:00}
      HTMLRENDER_CONNECT_OVER_CDP: http://127.0.0.1:9222
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-kndbot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-kndbot}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kndbot}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-kndbot}
      SYSTEM_PROXY: ${SYSTEM_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium}
      DECK_SERVICE_URLS: ${DECK_SERVICE_URLS:-http://host.docker.internal:45557}
      PJSK_HELPER_URL: ${PJSK_HELPER_URL:-http://host.docker.internal:45558}
      PJSK_SUITE_BACKEND: ${PJSK_SUITE_BACKEND:-go}
      PJSK_MASTERDATA_AGENT: ${PJSK_MASTERDATA_AGENT:-go}
      PJSK_ASSET_AGENT: ${PJSK_ASSET_AGENT:-go}
      PJSK_RANKING_COLLECTOR: ${PJSK_RANKING_COLLECTOR:-go}
      DECK_BACKENDS: ${DECK_BACKENDS:-allium}
      HARUKI_DRAWING_API_URLS: ${HARUKI_DRAWING_API_URLS:-}
      HARUKI_DECK_SERVICE_URLS: ${HARUKI_DECK_SERVICE_URLS:-}
      # 留空 = pjsk 出图在 bot 进程内完成；配上 pjsk-draw 地址则走独立绘图服务
      PJSK_DRAW_SERVICE_URLS: ${PJSK_DRAW_SERVICE_URLS:-}
      GAMEAPI_TOKEN: ${GAMEAPI_TOKEN:-}
      AUTOCHAT_RPC_TOKEN: ${AUTOCHAT_RPC_TOKEN:-}
      # sekai-api（remote 模块）：容器化后走服务名直连，
      # CONTROL_* 仅为兼容旧的宿主部署，不配也能正常工作。
      SEKAI_API_URL: ${SEKAI_API_URL:-http://sekai-api:9999}
      SEKAI_API_TOKEN: ${SEKAI_API_TOKEN:-}
      SEKAI_CONTROL_URL: ${SEKAI_CONTROL_URL:-}
      SEKAI_CONTROL_TOKEN: ${SEKAI_CONTROL_TOKEN:-}
      SEKAI_REMOTE_ACCOUNT: ${SEKAI_REMOTE_ACCOUNT:-}
      SEKAI_REMOTE_REGION: ${SEKAI_REMOTE_REGION:-cn}
      SEKAI_LIVE_INTERVAL: ${SEKAI_LIVE_INTERVAL:-80}
      SEKAI_LIVE_AUTO_STOP: ${SEKAI_LIVE_AUTO_STOP:-03:55}
      # meme-generator 的素材（约 400MB）落在挂载出去的 data/ 下，
      # 否则每次重建镜像都要重新下载二十多分钟。
      MEME_HOME: /app/data/meme_generator
      # 首次拉素材走代理（走 jsdelivr，国内直连很慢）；留空表示直连。
      MEME_DOWNLOAD_PROXY: ${MEME_DOWNLOAD_PROXY:-}
      MEME_CHECK_RESOURCES: ${MEME_CHECK_RESOURCES:-1}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      # 其余配置（NICKNAME、COMMAND_START、多机器人账号等）由 .env 提供
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    init: true
