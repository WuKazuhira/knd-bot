# 多实例部署时在 .env 覆盖 KND_PROJECT / KND_PREFIX / KND_IMAGE 和端口
name: ${KND_PROJECT:-kndbot}

x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
  ALL_PROXY: ${BUILD_ALL_PROXY:-}
  NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,.cn,.com.cn,mirrors.aliyun.com,goproxy.cn,postgres,kndbot,chromium,kndbot-chromium,pjsk-helper,pjsk-draw,allium-deck-server,deck-recommender,host.docker.internal}

services:
  postgres:
    image: postgres:16
    container_name: ${KND_PREFIX:-kndbot}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kndbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kndbot}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromium:
    build:
      context: .
      dockerfile: Dockerfile.chromium
      network: host
      args:
        <<: *build-proxy-args
    image: ${KND_CHROMIUM_IMAGE:-kndbot-chromium:local}
    container_name: ${KND_PREFIX:-kndbot}-chromium
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KND_PORT:-18081}:8081"
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - host.docker.internal:host-gateway
    # 与 kndbot 挂载相同路径，供浏览器直接读取模板和字体
    volumes:
      - ./src:/app/src:ro
      - ./data/resources:/app/data/resources:ro
      - ./data/resources/font:/usr/local/share/fonts/kndbot:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 内置组卡服务由 deck-http profile 启用
  allium-deck-data-init:
    profiles: ["deck-http"]
    image: ${KND_IMAGE:-kndbot:local}
    container_name: ${KND_PREFIX:-kndbot}-allium-deck-data-init
    user: "${KND_UID:-0}:${KND_GID:-0}"
    restart: "no"
    working_dir: /app
    entrypoint: ["python", "/app/scripts/pjsk/sync_masterdata.py"]
    command:
      - "--region"
      - "jp"
      - "--region"
      - "tw"
      - "--region"
      - "cn"
    environment:
      HOME: /tmp
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      PJSK_DATA_DIR: /app/data/pjsk/ondemand
      PJSK_HELPER_URL: ${PJSK_HELPER_URL:-http://pjsk-helper:8000}
      KNDBOT_CONFIG_DIR: /app/config
      MUSIC_METAS_URL: ${MUSIC_METAS_URL:-}
    depends_on:
      pjsk-helper:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./data/pjsk:/app/data/pjsk

  allium-deck-server:
    profiles: ["deck-http"]
    build:
      context: .
      dockerfile: docker/allium-deck-server.Dockerfile
      network: host
      args:
        <<: *build-proxy-args
        RUST_VERSION: ${ALLIUM_DECK_RUST_VERSION:-1.94}
        LIBC: ${ALLIUM_DECK_LIBC:-gnu}
        ALLOC: ${ALLIUM_DECK_ALLOC:-}
        RUNTIME: ${ALLIUM_DECK_RUNTIME:-distroless}
    image: ${ALLIUM_DECK_IMAGE:-kndbot-allium-deck:local}
    container_name: ${KND_PREFIX:-kndbot}-allium-deck
    restart: unless-stopped
    command:
      - "--bind"
      - "0.0.0.0:45557"
    ports:
      - "127.0.0.1:${DECK_RECOMMENDER_PORT:-45557}:45557"
    environment:
      ALLIUM_DECK_MASTERDATA: jp=/data/jp,tw=/data/tw,cn=/data/cn
      ALLIUM_DECK_MUSIC_METAS: jp=/data/deckrec/musicmetas_jp.json,tw=/data/deckrec/musicmetas_tw.json,cn=/data/deckrec/musicmetas_cn.json
      ALLIUM_DECK_DEFAULT_REGION: ${ALLIUM_DECK_DEFAULT_REGION:-jp}
      ALLIUM_DECK_WORKERS: ${ALLIUM_DECK_WORKERS:-2}
      ALLIUM_DECK_MAX_QUEUE: ${ALLIUM_DECK_MAX_QUEUE:-16}
      ALLIUM_DECK_QUEUE_TIMEOUT_MS: ${ALLIUM_DECK_QUEUE_TIMEOUT_MS:-1000}
      ALLIUM_DECK_MAX_SEARCH_TIMEOUT_MS: ${ALLIUM_DECK_MAX_SEARCH_TIMEOUT_MS:-30000}
      ALLIUM_DECK_MAX_LIMIT: ${ALLIUM_DECK_MAX_LIMIT:-30}
      ALLIUM_DECK_MAX_BODY_BYTES: ${ALLIUM_DECK_MAX_BODY_BYTES:-8388608}
      ALLIUM_DECK_LOG_FORMAT: ${ALLIUM_DECK_LOG_FORMAT:-text}
    depends_on:
      allium-deck-data-init:
        condition: service_completed_successfully
    volumes:
      - ./data/pjsk/ondemand:/data:ro
    networks:
      default:
        aliases:
          - deck-recommender

  # PJSK 独立绘图服务（Rust），data/pjsk 需可写以便按需下载资源
  pjsk-draw:
    build:
      context: ./services/rust-pjsk-draw
      network: host
      args:
        <<: *build-proxy-args
    image: ${KND_PJSK_DRAW_IMAGE:-kndbot-pjsk-draw:local}
    container_name: ${KND_PREFIX:-kndbot}-pjsk-draw
    user: "${KND_UID:-0}:${KND_GID:-0}"
    restart: unless-stopped
    working_dir: /app
    depends_on:
      pjsk-helper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PJSK_DRAW_PORT:-45560}:45560"
    environment:
      HOME: /tmp
      TZ: ${TZ:-Asia/Shanghai}
      KNDBOT_CONFIG_DIR: /app/config
      KNDBOT_DATA_DIR: /app/data
      PJSK_DRAW_HOST: 0.0.0.0
      PJSK_DRAW_PORT: "45560"
      PJSK_HELPER_URL: ${PJSK_HELPER_URL:-http://pjsk-helper:8000}
      RUST_LOG: ${PJSK_DRAW_RUST_LOG:-info}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,pjsk-helper,pjsk-draw},host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config:/app/config:ro
      - ./data/pjsk:/app/data/pjsk
      - ./data/resources:/app/data/resources
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:45560/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PJSK 业务 Go 服务，接管 PJSK 指令
  go-pjsk-bot:
    build:
      context: ./services/go/go-pjsk-bot
      network: host
      args:
        <<: *build-proxy-args
    image: ${KND_GO_PJSK_IMAGE:-kndbot-go-pjsk:local}
    container_name: ${KND_PREFIX:-kndbot}-go-pjsk-bot
    user: "${KND_UID:-0}:${KND_GID:-0}"
    restart: unless-stopped
    # 反向 WS 端口，供宿主机 OneBotFilter 连接
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      pjsk-draw:
        condition: service_healthy
      pjsk-helper:
        condition: service_healthy
    environment:
      HOME: /tmp
      TZ: ${TZ:-Asia/Shanghai}
      PJSKBOT_ONEBOT_MODE: ${PJSKBOT_ONEBOT_MODE:-reverse}
      # PJSKBOT_STANDALONE 仅作旧开关兼容，留空由 KNDBOT_PJSK_RUNTIME 推导
      KNDBOT_PJSK_RUNTIME: ${KNDBOT_PJSK_RUNTIME:-go}
      PJSKBOT_STANDALONE: ${PJSKBOT_STANDALONE:-}
      # 默认关闭 UNIBOT 检测，需要时设 1
      PJSKBOT_UNIBOT_CHECK: ${PJSKBOT_UNIBOT_CHECK:-0}
      PJSKBOT_ONEBOT_LISTEN_ADDR: ${PJSKBOT_ONEBOT_LISTEN_ADDR:-:3001}
      PJSKBOT_ONEBOT_PATH: ${PJSKBOT_ONEBOT_PATH:-/onebot/v11/ws}
      PJSKBOT_LOG_MESSAGES: ${PJSKBOT_LOG_MESSAGES:-0}
      PJSKBOT_ONEBOT_WS_URL: ${PJSKBOT_ONEBOT_WS_URL:-ws://host.docker.internal:3001}
      PJSKBOT_ONEBOT_TOKEN: ${PJSKBOT_ONEBOT_TOKEN:-}
      PJSKBOT_ALLOW_UNAUTHENTICATED_ONEBOT: ${PJSKBOT_ALLOW_UNAUTHENTICATED_ONEBOT:-0}
      PJSKBOT_GROUP_MANAGER_PATH: ${PJSKBOT_GROUP_MANAGER_PATH:-/app/data/manager/group_manager.json}
      # 仅灰度模式使用，standalone 下留空
      KND_GO_OWNED_COMMANDS: ${KND_GO_OWNED_COMMANDS:-[]}
      # 管理员 QQ（逗号分隔）
      PJSKBOT_SUPERUSERS: ${PJSKBOT_SUPERUSERS:-}
      # 兼容 Python 的 JSON 数组格式 SUPERUSERS
      SUPERUSERS: ${SUPERUSERS:-[]}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kndbot}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-kndbot}
      PJSK_DRAW_SERVICE_URL: ${PJSK_DRAW_SERVICE_URL:-http://pjsk-draw:45560}
      PJSK_DRAW_REQUEST_TIMEOUT: ${PJSK_DRAW_REQUEST_TIMEOUT:-150s}
      PJSK_HELPER_URL: ${PJSK_HELPER_URL:-http://pjsk-helper:8000}
      ALLIUM_DECK_SERVER_URL: ${ALLIUM_DECK_SERVER_URL:-http://allium-deck-server:45557}
      DECK_SERVICE_URLS: ${DECK_SERVICE_URLS:-}
      DECK_SERVICE_API: ${DECK_SERVICE_API:-v1}
      DECK_SERVICE_HTTP_TIMEOUT: ${DECK_SERVICE_HTTP_TIMEOUT:-120}
      GAMEAPI_TOKEN: ${GAMEAPI_TOKEN:-}
      # skme 查 remote_live 个人历史用
      SEKAI_REMOTE_ACCOUNT: ${SEKAI_REMOTE_ACCOUNT:-}
      SEKAI_REMOTE_REGION: ${SEKAI_REMOTE_REGION:-cn}
      PJSK_DATA_DIR: /app/data/pjsk
      PJSK_CONFIG_DIR: /app/config
      PJSK_STATIC_DIR: /app/data/pjsk/static
      PJSKBOT_LOCAL_NEW_CARD_ENABLED: "1"
      PJSKBOT_NEW_CARD_ASSET_BASE_URL: http://host.docker.internal:8082/jp-assets
      PJSKBOT_NEW_CARD_SNAPSHOT: /app/data/pjsk/ondemand/jp/local_new_card_snapshot.json
      # 3D 服装渲染服务，留空关闭服装截图通知
      PJSKBOT_HARUKI_3D_ENGINE_URL: ${PJSKBOT_HARUKI_3D_ENGINE_URL-http://haruki-3d-engine:8080}
      PJSKBOT_HARUKI_3D_RUNTIME_ROOT: /data/haruki-3d/jp
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium,pjsk-helper,pjsk-draw,haruki-3d-engine,allium-deck-server,deck-recommender},host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config:/app/config:ro
      - ./data/pjsk:/app/data/pjsk
      - ./data/manager:/app/data/manager:ro
      - ${HARUKI_3D_RUNTIME_HOST_DIR:-./volumes/haruki-3d-output}:/data/haruki-3d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  pjsk-helper:
    build:
      context: ./services/go/go-pjsk-helper
      network: host
      args:
        <<: *build-proxy-args
    image: ${KND_PJSK_HELPER_IMAGE:-kndbot-pjsk-helper:local}
    container_name: ${KND_PREFIX:-kndbot}-pjsk-helper
    user: "${KND_UID:-0}:${KND_GID:-0}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PJSK_HELPER_PORT:-45558}:8000"
    environment:
      HOME: /tmp
      TZ: ${TZ:-Asia/Shanghai}
      PJSK_DATA_DIR: /data/pjsk
      PJSK_SERVERS_YAML: /config/pjsk/servers.yaml
      PJSK_LOCAL_JP_MASTER_DIR: /local-jp/master/jp
      PJSK_LOCAL_JP_VERSION_FILE: /local-jp/version/jp.json
      LOCAL_JP_MASTER_SYNC_INTERVAL: "30s"
      # 默认开启主数据同步和榜线采集
      ENABLE_MASTERDATA_SYNC: ${PJSK_HELPER_MASTERDATA_SYNC:-1}
      ENABLE_RANKING_COLLECT: ${PJSK_HELPER_RANKING_COLLECT:-1}
      RANKING_COLLECT_INTERVAL: ${RANKING_COLLECT_INTERVAL:-1s}
      GAMEAPI_TOKEN: ${GAMEAPI_TOKEN:-}
      KNDBOT_CALLBACK_URL: ${PJSK_HELPER_CALLBACK_URL:-}
      # 定数表同步代理，默认复用 KND_GO_PROXY
      HTTP_PROXY: ${PJSK_HELPER_HTTP_PROXY:-${KND_GO_PROXY:-}}
      HTTPS_PROXY: ${PJSK_HELPER_HTTPS_PROXY:-${KND_GO_PROXY:-}}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium,pjsk-helper,pjsk-draw,haruki-3d-engine,allium-deck-server,deck-recommender},host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/pjsk:/data/pjsk
      - ./config/pjsk:/config/pjsk:ro
      # 挂载父目录，避免版本文件原子替换后失效
      - ${LOCAL_JP_DATA_HOST_DIR:-./volumes/local-jp}:/local-jp:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  kndbot:
    build:
      context: .
      network: host
      extra_hosts:
        - host.docker.internal:host-gateway
      args:
        <<: *build-proxy-args
    image: ${KND_IMAGE:-kndbot:local}
    container_name: ${KND_PREFIX:-kndbot}
    user: "${KND_UID:-0}:${KND_GID:-0}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chromium:
        condition: service_started
    working_dir: /app
    network_mode: service:chromium
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      MPLCONFIGDIR: /tmp/matplotlib
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      PORT: 8081
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      ONEBOT_SECRET: ${ONEBOT_SECRET:-}
      KNDBOT_ENABLE_EXEC_SQL: ${KNDBOT_ENABLE_EXEC_SQL:-0}
      SUPERUSERS: ${SUPERUSERS:-[]}
      BOT_DISPLAY_NAME: ${BOT_DISPLAY_NAME:-小七}
      SESSION_EXPIRE_TIMEOUT: ${SESSION_EXPIRE_TIMEOUT:-00:01:00}
      HTMLRENDER_CONNECT_OVER_CDP: http://127.0.0.1:9222
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-kndbot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-kndbot}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kndbot}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-kndbot}
      SYSTEM_PROXY: ${SYSTEM_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,kndbot,chromium,kndbot-chromium,pjsk-helper,pjsk-draw,haruki-3d-engine,allium-deck-server,deck-recommender},host.docker.internal
      # meme-generator 素材放持久化目录，避免重建镜像重下
      MEME_HOME: /app/data/meme_generator
      # 首次拉素材代理（走 jsdelivr，留空直连）
      MEME_DOWNLOAD_PROXY: ${MEME_DOWNLOAD_PROXY:-}
      MEME_CHECK_RESOURCES: ${MEME_CHECK_RESOURCES:-1}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      # 其余 NoneBot 配置从 .env 读
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    init: true
