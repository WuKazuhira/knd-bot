group_manager:
  # group_manager
  # DEFAULT_GROUP_LEVEL: 默认群权限
  # DEFAULT_GROUP_BOT_STATUS: 默认进群总开关状态
  DEFAULT_GROUP_LEVEL: 5
  DEFAULT_GROUP_BOT_STATUS: true
shop:
  # shop
  # IMPORT_DEFAULT_SHOP_GOODS: 导入商店自带的六个商品
  IMPORT_DEFAULT_SHOP_GOODS: true
_task:
  # _task
  # DEFAULT_BROADCAST: 被动 广播 进群默认开关状态
  # DEFAULT_GROUP_WELCOME: 被动 进群欢迎 进群默认开关状态
  # DEFAULT_REFUND_GROUP_REMIND: 被动 退群提醒 进群默认开关状态
  # DEFAULT_BILIBILI_PARSE: 被动 b站转发解析 进群默认开关状态
  # DEFAULT_FUDU: 被动 复读 进群默认开关状态
  DEFAULT_BROADCAST: true
  DEFAULT_GROUP_WELCOME: true
  DEFAULT_REFUND_GROUP_REMIND: false
  DEFAULT_BILIBILI_PARSE: false
  DEFAULT_FUDU: true
hook:
  # 基础hook配置
  # CHECK_NOTICE_INFO_CD: 群检测，个人权限检测等各种检测提示信息cd[单位：秒]
  CHECK_NOTICE_INFO_CD: 1800
invite_manager:
  # 好友群聊处理请求
  # AUTO_ADD_FRIEND: 是否自动同意好友添加
  # QUIT_MESSAGE: 强制拉群后进群回复的内容..
  # WELCOME_MESSAGE: 有新人进群的欢迎消息
  # FLAG: 被强制拉群后是否直接退出
  # WELCOME_MSG_CD: 群欢迎消息cd[单位：秒]
  # KICK_MSG_CD: 退群提醒消息cd[单位：秒]
  AUTO_ADD_FRIEND: false
  QUIT_MESSAGE: 请获得master的白名单后再拉小奏入群！告辞！
  WELCOME_MESSAGE:
  - 欢迎新人，这里是小七走，发送kndhelo获取食用说明~
  FLAG: true
  WELCOME_MSG_CD: 5
  KICK_MSG_CD: 5
admin_bot_manage:
  # 群管理员操作
  # SET_GROUP_WELCOME_MESSAGE_LEVEL: 设置群欢迎消息权限
  # CHANGE_GROUP_SWITCH_LEVEL: 开关群功能权限
  # ADMIN_DEFAULT_AUTH: 默认群管理员权限
  # WAKEUP_BOT_CMD: bot群开机指令
  # SHUTDOWN_BOT_CMD: bot群停机指令
  SET_GROUP_WELCOME_MESSAGE_LEVEL: 5
  CHANGE_GROUP_SWITCH_LEVEL: 5
  ADMIN_DEFAULT_AUTH: 5
  WAKEUP_BOT_CMD:
  - 起来工作
  - 唤醒
  SHUTDOWN_BOT_CMD:
  - 去休息吧
  - 休眠
_backup:
  # 文件备份
  # BACKUP_FLAG: 是否开启文件备份
  # BACKUP_DIR_OR_FILE: 备份的文件夹或文件
  BACKUP_FLAG: true
  BACKUP_DIR_OR_FILE:
  - data/config
  - data/statistics
  - data/word_bank
  - data/manager
  - config
word_bank:
  # 词库问答
  # WORD_BANK_LEVEL [LEVEL]: 设置增删词库的权限等级
  WORD_BANK_LEVEL [LEVEL]: 6
bili_parse:
  # bili_parse
  # ANALYSIS_BLACKLIST: b站解析黑名单qq
  ANALYSIS_BLACKLIST: []
image_management:
  # 图库操作
  # IMAGE_DIR_LIST: 公开图库列表，可自定义添加
  # WITHDRAW_IMAGE_MESSAGE: 自动撤回，参1：延迟撤回发送图库图片的时间(秒)，0 为关闭 | 参2：监控聊天类型，0(私聊) 1(群聊) 2(群聊+私聊)
  # DELETE_IMAGE_LEVEL: 删除图库图片需要的管理员等级
  # MOVE_IMAGE_LEVEL: 移动图库图片需要的管理员等级
  # UPLOAD_IMAGE_LEVEL: 上传图库图片需要的管理员等级
  # SHOW_ID: 是否消息显示图片下标id
  IMAGE_DIR_LIST:
  - 美图
  - 壁纸
  - 表情包
  WITHDRAW_IMAGE_MESSAGE:
  - 0
  - 1
  DELETE_IMAGE_LEVEL: 7
  MOVE_IMAGE_LEVEL: 7
  UPLOAD_IMAGE_LEVEL: 6
  SHOW_ID: false
pjsk_alias:
  # pjsk_alias
  # BANWORDS: 禁止出现的角色称呼，用_分隔称呼与类型，1代表仅不允许设置的称呼，否则代表不允许设置且有特殊回复
  BANWORDS:
  - 老婆_老婆
  - 老公_老公
  - 肯尼迪_1
what2eat:
  # what2eat
  # SUPERUSERS: 超级用户
  # WHAT2EAT_PATH: 资源路径
  # EATING_LIMIT: 每个餐点询问bot吃什么的上限次数
  # GROUP_ID: 记录每个群组的id，便于设置群特色菜单
  SUPERUSERS: []
  WHAT2EAT_PATH: data/what2eat
  EATING_LIMIT: 10
  GROUP_ID: []
sign_in:
  # 签到
  # MAX_SIGN_GOLD: 签到好感度加成额外获得的最大金币数
  # SIGN_CARD1_PROB: 签到好感度双倍加持卡Ⅰ掉落概率
  # SIGN_CARD2_PROB: 签到好感度双倍加持卡Ⅱ掉落概率
  # SIGN_CARD3_PROB: 签到好感度双倍加持卡Ⅲ掉落概率
  # RESIGN_CARD_PROB: 补签卡掉落概率
  MAX_SIGN_GOLD: 200
  SIGN_CARD1_PROB: 0.2
  SIGN_CARD2_PROB: 0.09
  SIGN_CARD3_PROB: 0.05
  RESIGN_CARD_PROB: 0.025
mute:
  # 刷屏禁言/拉黑
  # MUTE_LEVEL [LEVEL]: 更改禁言设置的管理权限
  # MUTE_DEFAULT_COUNT: 刷屏禁言默认检测次数
  # MUTE_DEFAULT_TIME: 刷屏检测默认规定时间
  # MUTE_DEFAULT_DURATION: 刷屏检测默认禁言时长（分钟）
  # MUTE_DEFAULT_TYPE: 刷屏检测默认禁言类型（mute/allmute/cmdmute）
  MUTE_LEVEL [LEVEL]: 6
  MUTE_DEFAULT_COUNT: 3
  MUTE_DEFAULT_TIME: 60
  MUTE_DEFAULT_DURATION: 0
  MUTE_DEFAULT_TYPE: mute
withdraw_handle:
  # 自助撤回
  # WITHDRAW_MAX_SIZE: 能够撤回的最久远消息数量
  WITHDRAW_MAX_SIZE: 100
weather:
  # 天气查询
  # APIKEY: 和风天气api的key，需要从官网注册账号自行获取
  # APITYPE: 和风天气api的类型
  APIKEY: ''
  APITYPE: 0
reload_setting:
  # 重载插件配置
  # AUTO_RELOAD: 自动重载配置文件
  # AUTO_RELOAD_TIME: 控制自动重载配置文件时长
  AUTO_RELOAD: false
  AUTO_RELOAD_TIME: 180
ban:
  # 拉黑用户
  # BAN_LEVEL [LEVEL]: ban/unban所需要的管理员权限等级
  BAN_LEVEL [LEVEL]: 2
nickname:
  # 昵称系统
  # BLACK_WORD: 昵称所屏蔽的关键词，会被替换为 *
  BLACK_WORD:
  - 爸
  - 爹
  - 爷
  - 妈
  - 死
  - 老婆
  - 老公
  - 宝贝
  - 丈夫
  - 歌姬
  - 寄
  - 鸡
  - 傻
  - 啥比
fudu:
  # 复读
  # FUDU_PROBABILITY: 复读概率
  FUDU_PROBABILITY: 0.7
