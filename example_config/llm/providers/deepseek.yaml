qps_limit: 5
quota_sync_interval_sec: 21600
price_unit: "$"

# 建议走环境变量 LLM_DEEPSEEK_API_KEY，这里留空
api_key: ""
base_url: "https://api.deepseek.com"

models:
  - name: "deepseek-flash"
    model_id: "deepseek-flash"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: high

  - name: "deepseek-v4-pro"
    model_id: "deepseek-v4-pro"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: high
