# PJSK 各区域数据源配置样板。
# 复制整个 example_config/ 为 config/ 后，把下列占位符替换为你自己的服务地址。

jp:
  api:
    profile_api_url: https://your-profile-api.example.com
    suite_api_url: https://your-suite-api.example.com/
    mysekai_api_url: https://your-suite-api.example.com/
    ranking_border_api_url: https://your-profile-api.example.com
    ranking_top100_api_url: https://your-profile-api.example.com/api
    ranking_top100_new_api_url: https://your-ranking-api.example.com
  masterdata:
    sources:
    - name: source-jp
      base_url: https://your-masterdata-source.example.com/jp/master/
      version_url: https://your-masterdata-source.example.com/jp/versions/current_version.json
  rip:
    sources:
    - name: assets
      base_url: https://your-assets-cdn.example.com/jp-assets/
