# PJSK 通用配置样板。
# 复制整个 example_config/ 为 config/ 后按需修改。

server_map:
  0: jp
  1: tw
  2: cn
api_base_urls: []
haruki:
  drawing_api_urls: []
timeouts:
  masterdata_update_check: 3
  masterdata_download: 160
  asset_download: 5
masterdata_fallback:
  cn:
    enabled: true
    region: jp
    names:
    - shopItems
  tw:
    enabled: true
    region: jp
    names:
    - '*'
deck:
  # 组卡命令由 Python deck 插件处理，固定使用 allium-sekai-deck。
  backends:
  - allium
  timeout: 30
  timeout_no_event: 45
  timeout_single_algorithm: 15
  timeout_bonus: 15
  default_algorithms:
  - dfs
  - ga
  return_num_multi: 7
  return_num_challenge: 3
  return_num_bonus: 7
# 绘图服务（services/pjsk_draw）。
# service_urls 留空 = 在 bot 进程内直接渲染（默认，无需额外部署）；
# 填了地址就走 HTTP 调独立的绘图服务进程，多个地址会轮转分摊。
# 环境变量 PJSK_DRAW_SERVICE_URLS 优先于此项。
draw:
  service_urls: []
  timeout: 120
  # HTTP 调用失败时是否回退到进程内渲染
  fallback_local: true

endpoints:
  music_metas_base_url: ''
  music_alias_api_url: ''
  rank_match_api_base_url: ''
  worldlink_latest_api_url: https://{host}/api/public/v2/{region}/worldlink-latest
  forecast_events_api_url: ''
  forecast_latest_api_url: ''
  chart_preview_base_url: ''
  auth_url_keywords: []
