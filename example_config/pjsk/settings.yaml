# PJSK 通用配置样板。
# 复制整个 example_config/ 为 config/ 后按需修改。

server_map:
  0: jp
  1: tw
  2: cn
api_base_urls: []
haruki:
  drawing_api_urls: []
  deck_service_urls: []
timeouts:
  masterdata_update_check: 3
  masterdata_download: 160
  asset_download: 5
masterdata_fallback:
  cn:
    enabled: true
    region: jp
    names:
    - shopItems
  tw:
    enabled: true
    region: jp
    names:
    - '*'
deck:
  backends:
  - http
  service_urls:
  - http://127.0.0.1:45557
  timeout: 30
  timeout_no_event: 45
  timeout_single_algorithm: 15
  timeout_bonus: 15
  default_algorithms:
  - dfs
  - ga
  return_num_multi: 7
  return_num_challenge: 3
  return_num_bonus: 7
endpoints:
  music_metas_base_url: ''
  music_alias_api_url: ''
  rank_match_api_base_url: ''
  worldlink_latest_api_url: ''
  forecast_events_api_url: ''
  forecast_latest_api_url: ''
  chart_preview_base_url: ''
  auth_url_keywords: []
