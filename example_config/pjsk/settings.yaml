# PJSK 通用配置，复制到 config/ 后按需修改

server_map:
  0: jp
  1: tw
  2: cn
api_base_urls: []
haruki:
  drawing_api_urls: []
timeouts:
  masterdata_update_check: 3
  masterdata_download: 160
  asset_download: 5
masterdata_fallback:
  cn:
    enabled: true
    region: jp
    names:
    - shopItems
  tw:
    enabled: true
    region: jp
    names:
    - '*'
deck:
  # 组卡后端：默认 allium（进程内），可选 http / both
  backends:
  - allium
  # 组卡 HTTP 服务地址（启用 http/both 时填写）
  service_urls: []
  service_api: v1
  http_timeout: 120
  timeout: 30
  timeout_no_event: 45
  timeout_single_algorithm: 15
  timeout_bonus: 15
  default_algorithms:
  - dfs
  - ga
  return_num_multi: 7
  return_num_challenge: 3
  return_num_bonus: 7
# 绘图服务地址（留空本地渲染，多个地址轮询；环境变量 PJSK_DRAW_SERVICE_URLS 优先）
draw:
  service_urls: []
  timeout: 120
  # 绘图服务失败时是否回退本地渲染
  fallback_local: true

endpoints:
  music_metas_base_url: ''
  music_alias_api_url: ''
  rank_match_api_base_url: ''
  worldlink_latest_api_url: https://{host}/api/public/v2/{region}/worldlink-latest
  forecast_events_api_url: ''
  forecast_latest_api_url: ''
  chart_preview_base_url: ''
  auth_url_keywords: []
